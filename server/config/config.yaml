app:
  host: 127.0.0.1
  port: 8002
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

llm:
  model: gemini/gemini-2.0-flash-exp

crew:
  verbose: true



# "crewai" (default) or "openclaw". Override with BLOG_BACKEND.
backend: crewai

openclaw:
  base_url: http://127.0.0.1:18789   # override with OPENCLAW_GATEWAY_URL
  timeout_seconds: 600               # per stage
  agents:
    planner: blog-planner
    writer: blog-writer
    editor: blog-editor
